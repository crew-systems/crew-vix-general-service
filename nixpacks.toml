# Nixpacks configuration for Easypanel / Railway / Coolify
[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs_20", "bun"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "exec caddy run --config /app/Caddyfile --adapter caddyfile 2>&1"
